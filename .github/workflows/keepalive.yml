name: Garder la base Supabase active
# Le plan gratuit de Supabase met un projet en pause après 7 jours sans activité.
# Cette tâche gratuite appelle la base tous les jours pour l'éviter.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appel de la base
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js || true)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js non rempli : rien à faire"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
